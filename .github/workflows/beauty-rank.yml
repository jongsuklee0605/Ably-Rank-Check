name: Canmake Ably Beauty Ranking Check

on:
  schedule:
    - cron: "30 * * * *"   # 기존 워크플로(정각)와 겹치지 않게 30분에 실행
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # 한글 폰트(스크린샷용) - 실패해도 진행
          timeout 90 sudo apt-get install -y --no-install-recommends fonts-nanum || echo "한글 폰트 설치 생략"

      - name: Check ranking
        run: xvfb-run -a python check_rank.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRAND_NAME: "Canmake"
          REPORT_TITLE: "에이블리 뷰티랭킹 체크"
          TOP_N: "100"
          RANKINGS: |
            뷰티랭킹 전체|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D||100
            뷰티랭킹 포인트 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|포인트 메이크업|100
            뷰티랭킹 베이스 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|베이스 메이크업|100
            
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beauty-debug-files
          path: |
            debug_*.png
            debug_*.txt
          if-no-files-found: ignore
          retention-days: 3
