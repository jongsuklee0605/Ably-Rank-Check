name: Canmake Ably Beauty Ranking Check

on:
  schedule:
    - cron: "30 * * * *"   # 기존 워크플로(정각)와 겹치지 않게 30분에 실행
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check ranking
        run: xvfb-run -a python check_rank.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRAND_NAME: "Canmake"
          REPORT_TITLE: "에이블리 뷰티랭킹 체크"
          TOP_N: "100"
          RANKINGS: |
            뷰티랭킹 전체|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D||100
            뷰티랭킹 포인트 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|포인트 메이크업|100
            뷰티랭킹 베이스 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|베이스 메이크업|100
            뷰티랭킹 스킨케어|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|스킨케어|100
            뷰티랭킹 클렌징|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|클렌징|100
            뷰티랭킹 바디케어|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|바디케어|100
            뷰티랭킹 뷰티 소품|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|뷰티 소품|100
            뷰티랭킹 향수|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|향수|100

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beauty-debug-files
          path: |
            debug_*.png
            debug_*.txt
          if-no-files-found: ignore
          retention-days: 3
