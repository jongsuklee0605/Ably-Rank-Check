name: Canmake Ably Beauty Ranking Check

on:
  schedule:
    - cron: "30 * * * *"   # 기존 워크플로(정각)와 겹치지 않게 30분에 실행
  workflow_dispatch:

# 같은 워크플로가 겹쳐 실행되지 않게 함 (수동 실행 + 스케줄 중복으로 Slack 메시지가 두 번 오는 것 방지)
concurrency:
  group: canmake-ably-beauty-rank
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # 프록시 검사/교체 시간 때문에 20분 -> 30분
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          # 한글 폰트(스크린샷용) - 실패해도 진행
          timeout 90 sudo apt-get install -y --no-install-recommends fonts-nanum || echo "한글 폰트 설치 생략"

      - name: Check ranking
        run: xvfb-run -a python check_rank.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRAND_NAME: "Canmake"
          REPORT_TITLE: "에이블리 뷰티랭킹 체크"
          TOP_N: "100"

          # 접속 환경: desktop(데스크톱 UA) / mobile(아이폰 UA). 막히면 서로 바꿔서 시도
          CLIENT_MODE: "desktop"

          # --- 무료 프록시 풀 (둘 다 비워두면 프록시 없이 직접 접속) ---
          # host:port 가 한 줄에 하나씩 나오는 텍스트 주소 (한국 KR 필터 권장)
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
          # 직접 목록을 넣고 싶을 때 (줄바꿈 구분)
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          # 유료/고정 프록시가 있을 때 (http://user:pass@host:port)
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_PREFILTER_MAX: "300"
          PROXY_BROWSER_TRIES: "6"
          PROXY_ROTATIONS: "3"

          RANKINGS: |
            뷰티랭킹 전체|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D||100
            뷰티랭킹 포인트 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|포인트 메이크업|100
            뷰티랭킹 베이스 메이크업|https://mobile.a-bly.com/screens?screen_name=BEAUTY_RANKING&next_token=eyJiZWF1dHlfcmFua2luZ190eXBlIjogMX0%3D|베이스 메이크업|100

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beauty-debug-files
          path: |
            debug_*.png
            debug_*.txt
            debug_*.json
          if-no-files-found: ignore
          retention-days: 3
