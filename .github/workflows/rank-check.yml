name: Canmake Ably Rank Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER: "webkit"
      CHANNEL: ""
      DEVICE: "iPhone 14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install browser
        run: |
          python -m playwright install "$BROWSER"
          python -m playwright install-deps "$BROWSER" || true
          if [ -n "$CHANNEL" ]; then python -m playwright install "$CHANNEL"; fi

      - name: Check ranking
        run: xvfb-run -a python check_rank.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HEADLESS: "false"
          MARKET_ID: "116160"
          BRAND_NAME: "Canmake"
          TOP_N: "100"
          STALE_SEC: "120"
          MAX_SEC: "360"
          SCAN_TRIES: "1"
          BLOCK_IMAGES: "false"
          # 이름|시작주소|이동순서|랭킹카테고리|TOP_N|대기초
          RANKINGS: |
            뷰티 랭킹|https://mobile.a-bly.com/|뷰티>랭킹|뷰티|100|300
            전체 랭킹|https://mobile.a-bly.com/|뷰티>랭킹||100|

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_*.png
            debug_*.txt
          if-no-files-found: ignore
          retention-days: 3
