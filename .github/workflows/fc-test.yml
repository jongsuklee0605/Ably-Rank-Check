name: Firecrawl Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run Firecrawl test
        run: python fc_test.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-out
          path: firecrawl_out.md
          if-no-files-found: ignore
          retention-days: 3
